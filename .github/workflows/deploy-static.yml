name: Deploy Static Site

on:
  push:
    branches:
      - main
    paths:
      - "src/eq_cli/static/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "production"

permissions:
  contents: read
  id-token: write   # Required for OIDC authentication with AWS

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy from the main branch to prevent accidental deletion via --delete.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync static files to S3
        run: |
          VERSION=$(python - <<'PY'
          from pathlib import Path
          import re
          
          content = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version = "(.+)"$', content)
          if match is None:
              raise SystemExit("Unable to read version from pyproject.toml")
          print(match.group(1))
          PY
          )
          mkdir -p /tmp/eq-cli-static
          cp -R src/eq_cli/static/. /tmp/eq-cli-static/
          sed -i "s/__EQ_CLI_VERSION__/${VERSION}/g" /tmp/eq-cli-static/index.html
          aws s3 sync /tmp/eq-cli-static/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public,max-age=3600,s-maxage=86400"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Print deployment URL
        run: |
          echo "Deployed to: https://${{ vars.CLOUDFRONT_DOMAIN }}"
