name: Auto Bump Version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: bump-version-main
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump patch version in pyproject.toml
        id: bump
        run: |
          new_version=$(python - <<'PY'
          from pathlib import Path
          import re

          # Increment the package patch version in pyproject.toml.
          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")

          version_pattern = (
              r'(?m)^version = "(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)"$'
          )
          match = re.search(version_pattern, pyproject_text)
          if match is None:
              raise SystemExit("Could not find project version in pyproject.toml")

          major = int(match.group("major"))
          minor = int(match.group("minor"))
          patch = int(match.group("patch"))
          next_version = f"{major}.{minor}.{patch + 1}"
          updated_text = re.sub(
              version_pattern,
              f'version = "{next_version}"',
              pyproject_text,
              count=1,
          )
          pyproject_path.write_text(updated_text, encoding="utf-8")
          print(next_version)
          PY
          )
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Commit and push bumped version
        id: push_bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pyproject.toml; then
            echo "No version changes detected; skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add pyproject.toml
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger static deploy workflow
        if: steps.push_bump.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/deploy-static.yml/dispatches" \
            -f ref='main'
