<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>frequency-analyzer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .tb-group { display: flex; align-items: center; gap: 6px; }

    .tb-sep {
      width: 1px;
      height: 20px;
      background: #30363d;
      flex-shrink: 0;
    }

    label { color: #8b949e; font-size: 11px; white-space: nowrap; }

    select, button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      white-space: nowrap;
    }

    select:focus, button:focus { outline: 1px solid #58a6ff; }
    button:hover { background: #30363d; }
    button.active { background: #1f6feb; border-color: #58a6ff; color: #e6edf3; }

    #device-select { max-width: 220px; }

    #tb-meta {
      margin-left: auto;
    }

    #status {
      font-size: 11px;
      color: #8b949e;
      white-space: nowrap;
    }
    #status.ok   { color: #3fb950; }
    #status.err  { color: #f85149; }
    #status.warn { color: #d29922; }

    #version-badge {
      color: #8b949e;
      font-size: 11px;
      white-space: nowrap;
    }

    #repo-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8b949e;
      text-decoration: none;
      font-size: 11px;
      border: 1px solid #30363d;
      border-radius: 999px;
      padding: 2px 8px 2px 4px;
      background: #21262d;
    }

    #repo-link:hover {
      color: #c9d1d9;
      background: #30363d;
    }

    #repo-avatar {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: block;
    }

    #canvas-container { flex: 1; position: relative; min-height: 0; }

    canvas { display: block; width: 100%; height: 100%; }

    #footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px 10px;
      background: #161b22;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
    }

    #start-prompt {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #start-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 22px 30px;
      text-align: center;
      pointer-events: auto;
      max-width: 340px;
    }

    #start-card h2 { color: #58a6ff; margin-bottom: 8px; font-size: 15px; }
    #start-card p  { color: #8b949e; font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
    #btn-detect    { font-size: 12px; padding: 6px 18px; }

    /* ── Settings panel ──────────────────────────────────────────────────── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      overflow-y: auto;
    }

    #settings-panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      width: min(1100px, calc(100vw - 32px));
      margin: 24px auto;
      padding: 20px 24px;
      font-size: 12px;
    }

    #settings-panel h3 {
      color: #58a6ff;
      font-size: 13px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #settings-panel .settings-subtitle {
      color: #8b949e;
      font-size: 11px;
      margin-bottom: 14px;
    }

    #settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(320px, 1fr));
      gap: 14px 20px;
    }

    .settings-section { margin-bottom: 0; }

    .settings-section-title {
      color: #8b949e;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 4px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(140px, 1.3fr);
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .settings-row label {
      color: #c9d1d9;
      font-size: 11px;
    }

    .settings-row input[type="text"],
    .settings-row input[type="number"],
    .settings-row select {
      flex: 1;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    .settings-row input[type="color"] {
      flex: 0 0 40px;
      height: 24px;
      padding: 1px 2px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      cursor: pointer;
    }

    .settings-row input[type="checkbox"] {
      justify-self: start;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    .settings-row-profile {
      grid-template-columns: minmax(140px, 1fr) minmax(140px, 1fr) auto;
    }

    #settings-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #21262d;
    }

    @media (max-width: 920px) {
      #settings-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .settings-row,
      .settings-row-profile {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <label for="device-select">Device:</label>
    <select id="device-select" title="Audio input device">
      <option value="">&#8212; select device &#8212;</option>
    </select>
    <button id="btn-start">&#9654; Start</button>
    <button id="btn-stop" style="display:none">&#9632; Stop</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <label for="sel-profile">Profile:</label>
    <select id="sel-profile" title="Built-in profile">
      <option value="">-- select profile --</option>
    </select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btn-settings" title="Settings" aria-label="Open settings panel">&#9881; Settings</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="tb-meta">
    <a id="repo-link" href="https://github.com/astro-derek/eq-cli" target="_blank" rel="noopener noreferrer" title="astro-derek/eq-cli on GitHub">
      <img id="repo-avatar" src="https://github.com/astro-derek.png" alt="astro-derek avatar">
      <span>astro-derek/eq-cli</span>
    </a>
    <span id="version-badge" title="eq-cli version"></span>
  </div>
</div>

<div id="canvas-container">
  <canvas id="eq-canvas"></canvas>
  <div id="start-prompt">
    <div id="start-card">
      <h2>eq-cli web</h2>
      <p>Click below to allow microphone access, then select a device and click Start.</p>
      <button id="btn-detect">Detect Devices</button>
    </div>
  </div>
</div>

<div id="footer">
  <div class="tb-group">
    <button id="btn-freeze" title="[F] Freeze display" accesskey="f" aria-keyshortcuts="f"><u>F</u>reeze</button>
    <button id="btn-reset" title="[R] Reset peaks" accesskey="r" aria-keyshortcuts="r"><u>R</u>eset Peaks</button>
    <button id="btn-snap" title="[S] Save PNG" accesskey="s" aria-keyshortcuts="s">&#128247; <u>S</u>napshot</button>
  </div>
</div>

<script>
'use strict';

// ── Default config (overwritten from /config on load, then localStorage) ──────
var DEFAULT_VERSION = '__EQ_CLI_VERSION__';
var DEFAULT_HISTORY_FPS = 12;
var DEFAULT_PROFILE_PRESETS = {
  'default': {
    bar_color: '#44cccc',
    peak_color: '#cc4444',
    history_color: '#44cccc',
    axis_color: '#666666',
    label_color: '#aaaaaa'
  },
  'green-based': {
    bar_color: '#44cc44',
    peak_color: '#66ff66',
    history_color: '#66ff66',
    axis_color: '#66ff66',
    label_color: '#44cc44'
  },
  'high-contrast': {
    bar_color: '#66ffff',
    peak_color: '#ff6666',
    history_color: '#66ffff',
    axis_color: '#ffffff',
    label_color: '#ffff66'
  },
  'minimal': {
    bar_color: '#aaaaaa',
    peak_color: '#ffffff',
    history_color: '#aaaaaa',
    axis_color: '#666666',
    label_color: '#aaaaaa'
  },
  'neon-night': {
    bar_color: '#66ffff',
    peak_color: '#ffff66',
    history_color: '#ff66ff',
    axis_color: '#6666ff',
    label_color: '#ff66ff'
  },
  'studio': {
    bar_color: '#44cc44',
    peak_color: '#ff6666',
    history_color: '#44cc44',
    axis_color: '#777777',
    label_color: '#ffffff'
  },
  'sunset-drive': {
    bar_color: '#ff66ff',
    peak_color: '#ff6666',
    history_color: '#66ffff',
    axis_color: '#777777',
    label_color: '#ffff66'
  }
};

var CFG = {
  db_min: -80, db_max: 6, db_interval: 10, graph_height: 10,
  band_count: 64, gain_db: 0, volume_mode: 'relative', channel_mode: 'sum',
  fft_size: 4096, history_fps: DEFAULT_HISTORY_FPS,
  graph_style: 'filled',
  bar_color: '#44cccc', peak_color: '#cc4444',
  history_color: '#44cccc', axis_color: '#666666', label_color: '#aaaaaa',
  show_title: true,
  show_axis_labels: true, show_shortcuts: false,
  show_hover_tooltip: false,
  db_marker_style: 'spaced', history_rows: 0,
  history_gradient: ' .:-=+*#%@',
  peak_hold_frames: 0, peak_db_labels: false,
  axis_frequencies: null, band_gap: 0, profile_name: '',
  app_version: '', profile_presets: {}
};

// Immutable copy of built-in defaults used by "Reset Defaults".
var DEFAULTS = JSON.parse(JSON.stringify(CFG));

async function loadConfig() {
  try {
    var r = await fetch('/config');
    if (r.ok) { Object.assign(CFG, await r.json()); }
  } catch (e) { console.warn('Failed to load config, using defaults:', e); }
  // User-saved browser settings take the highest priority.
  var saved = _loadLocalSettings();
  if (saved) { Object.assign(CFG, saved); }
}

// ── localStorage settings helpers ─────────────────────────────────────────────
function _persistableSettings(source) {
  if (!source || typeof source !== 'object') { return null; }
  var settings = Object.assign({}, source);
  delete settings.app_version;
  delete settings.profile_presets;
  return settings;
}

function _loadLocalSettings() {
  try {
    var raw = localStorage.getItem('eq-cli-settings');
    if (!raw) { return null; }
    return _persistableSettings(JSON.parse(raw));
  } catch (e) { return null; }
}

function _saveLocalSettings() {
  try {
    var persisted = _persistableSettings(CFG);
    if (!persisted) { return; }
    localStorage.setItem('eq-cli-settings', JSON.stringify(persisted));
  } catch (e) {}
}

// ── Settings panel ────────────────────────────────────────────────────────────
function openSettings() {
  var colorKeys = ['bar_color', 'peak_color', 'history_color', 'axis_color', 'label_color'];
  colorKeys.forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { el.value = CFG[k] || '#000000'; }
  });

  var intKeys = ['db_min', 'db_max', 'db_interval', 'graph_height', 'band_count',
                 'band_gap', 'peak_hold_frames', 'history_rows', 'history_fps'];
  intKeys.forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { el.value = CFG[k] !== undefined ? String(CFG[k]) : ''; }
  });

  var gainEl = document.getElementById('cfg-gain_db');
  if (gainEl) { gainEl.value = String(CFG.gain_db !== undefined ? CFG.gain_db : 0); }

  var strKeys = ['db_marker_style', 'history_gradient', 'graph_style'];
  strKeys.forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { el.value = CFG[k] !== undefined ? CFG[k] : ''; }
  });

  var volumeEl = document.getElementById('cfg-volume_mode');
  if (volumeEl) { volumeEl.value = CFG.volume_mode || 'relative'; }
  var channelEl = document.getElementById('cfg-channel_mode');
  if (channelEl) { channelEl.value = CFG.channel_mode || 'sum'; }
  var fftEl = document.getElementById('cfg-fft_size');
  if (fftEl) { fftEl.value = String(CFG.fft_size || 4096); }

  var boolKeys = ['peak_db_labels', 'show_title', 'show_axis_labels', 'show_shortcuts',
                  'show_hover_tooltip'];
  boolKeys.forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { el.checked = !!CFG[k]; }
  });

  var axFreqEl = document.getElementById('cfg-axis_frequencies');
  if (axFreqEl) {
    axFreqEl.value = CFG.axis_frequencies ? CFG.axis_frequencies.join(',') : '';
  }

  document.getElementById('settings-overlay').style.display = 'block';
}

function populateProfilePresets() {
  var el = document.getElementById('sel-profile');
  if (!el) { return; }
  var presetMap = getProfilePresetsOrFallback();
  var names = Object.keys(presetMap).sort();
  var selected = CFG.profile_name || el.value || '';
  el.innerHTML = '<option value="">-- select profile --</option>';
  names.forEach(function (name) {
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    el.appendChild(opt);
  });
  if (selected && names.indexOf(selected) !== -1) {
    el.value = selected;
    CFG.profile_name = selected;
  }
}

function applyProfilePreset() {
  var selectEl = document.getElementById('sel-profile');
  if (!selectEl || !selectEl.value) { return; }
  var presetMap = getProfilePresetsOrFallback();
  if (!Object.prototype.hasOwnProperty.call(presetMap, selectEl.value)) { return; }
  var preset = presetMap[selectEl.value];
  if (!preset) { return; }
  CFG.profile_name = selectEl.value;

  ['bar_color', 'peak_color', 'history_color', 'axis_color', 'label_color'].forEach(function (k) {
    if (!(k in preset)) { return; }
    CFG[k] = preset[k];
    var inputEl = document.getElementById('cfg-' + k);
    if (inputEl) { inputEl.value = preset[k]; }
  });
  _saveLocalSettings();
}

function getProfilePresetsOrFallback() {
  // Return server-provided presets when available; otherwise use built-in
  // defaults so the profile dropdown is always populated.
  var presetMap = CFG.profile_presets || {};
  return Object.keys(presetMap).length ? presetMap : DEFAULT_PROFILE_PRESETS;
}

function closeSettings() {
  document.getElementById('settings-overlay').style.display = 'none';
}

function applySettings() {
  var intKeys = ['db_min', 'db_max', 'db_interval', 'graph_height', 'band_count',
                 'band_gap', 'peak_hold_frames', 'history_rows', 'history_fps'];
  intKeys.forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (!el) { return; }
    var v = parseInt(el.value, 10);
    if (isNaN(v)) { v = 0; }
    if (k === 'history_fps') { v = Math.max(1, v); }
    CFG[k] = v;
  });

  var gainEl = document.getElementById('cfg-gain_db');
  if (gainEl) {
    var g = parseFloat(gainEl.value);
    CFG.gain_db = isNaN(g) ? 0 : g;
  }

  ['bar_color', 'peak_color', 'history_color', 'axis_color', 'label_color',
   'db_marker_style', 'history_gradient', 'graph_style'].forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { CFG[k] = el.value; }
  });

  var volumeEl = document.getElementById('cfg-volume_mode');
  if (volumeEl) { CFG.volume_mode = volumeEl.value; }
  var channelEl = document.getElementById('cfg-channel_mode');
  if (channelEl) { CFG.channel_mode = channelEl.value; }
  var fftEl = document.getElementById('cfg-fft_size');
  if (fftEl) {
    var fftSize = parseInt(fftEl.value, 10);
    CFG.fft_size = isNaN(fftSize) ? 4096 : fftSize;
  }

  ['peak_db_labels', 'show_title', 'show_axis_labels', 'show_shortcuts',
   'show_hover_tooltip'].forEach(function (k) {
    var el = document.getElementById('cfg-' + k);
    if (el) { CFG[k] = el.checked; }
  });

  var axFreqEl = document.getElementById('cfg-axis_frequencies');
  if (axFreqEl) {
    var raw = axFreqEl.value.trim();
    CFG.axis_frequencies = raw
      ? raw.split(',').map(function (s) { return parseFloat(s.trim()); })
           .filter(function (n) { return isFinite(n) && n > 0; })
      : null;
  }

  _saveLocalSettings();
  closeSettings();
  rebuildBandGeometry();
  ensurePeakArrays();
  resetPeaks();
  historyRows = [];
  historyLastPushMs = 0;
  if (analyserNode) { analyserNode.fftSize = getFftSize(); }
  initLayout();
  document.title = 'frequency-analyzer';
}

function resetSettingsToDefaults() {
  Object.assign(CFG, JSON.parse(JSON.stringify(DEFAULTS)));
  try { localStorage.removeItem('eq-cli-settings'); } catch (e) {}
  populateProfilePresets();
  openSettings();
}

// ── Audio state ───────────────────────────────────────────────────────────────
var audioCtx = null, analyserNode = null, mediaStream = null;

// ── Spectrum state ────────────────────────────────────────────────────────────
var peakLevels = null;      // Float32Array
var peakHoldCounts = null;  // Int32Array
var historyRows = [];       // Float32Array[], newest last
var historyLastPushMs = 0;
var frozen = false;
var frozenLevels = null;    // Float32Array cached when frozen
var runtimeStatusMessage = 'No device selected';

var PEAK_DECAY_DB = 0.5;

// ── Hover tooltip state ───────────────────────────────────────────────────────
// CSS-pixel position of the mouse relative to the canvas (or null when the
// pointer is outside the canvas or the tooltip setting is disabled).
var hoverPos = null;

function ensurePeakArrays() {
  var n = CFG.band_count;
  if (!peakLevels || peakLevels.length !== n) {
    peakLevels = new Float32Array(n).fill(CFG.db_min);
    peakHoldCounts = new Int32Array(n);
  }
}

// ── Log-spaced band geometry (matches Python SpectrumProcessor) ───────────────
function buildBandEdges(minHz, maxHz, count) {
  var e = new Float64Array(count + 1);
  for (var i = 0; i <= count; i++) {
    e[i] = minHz * Math.pow(maxHz / minHz, i / count);
  }
  return e;
}

var BAND_EDGES = buildBandEdges(20, 20000, CFG.band_count);
var BAND_CENTERS = (function () {
  var c = new Float64Array(CFG.band_count);
  for (var i = 0; i < c.length; i++) {
    c[i] = Math.sqrt(BAND_EDGES[i] * BAND_EDGES[i + 1]);
  }
  return c;
}());

function rebuildBandGeometry() {
  BAND_EDGES = buildBandEdges(20, 20000, CFG.band_count);
  BAND_CENTERS = new Float64Array(CFG.band_count);
  for (var i = 0; i < BAND_CENTERS.length; i++) {
    BAND_CENTERS[i] = Math.sqrt(BAND_EDGES[i] * BAND_EDGES[i + 1]);
  }
}

// ── FFT bins → band levels (dBFS) ────────────────────────────────────────────
var _fftBuf = new Float32Array(2048); // reused each frame

function computeBandLevels(fftData, sampleRate, fftSize) {
  // Compute each band's dB level in two parts:
  //   1. Linearly interpolate the FFT magnitude at the band's CENTER
  //      frequency (in dB, since getFloatFrequencyData already returns dB).
  //      This guarantees every band has a sample even when the log-band
  //      width is narrower than one FFT bin (common below ~100 Hz).
  //   2. Take the max across any bins that fall strictly inside the band
  //      range.  This preserves the existing behavior at high frequencies
  //      where many FFT bins fall into a single log band.
  //
  // Without step 1, narrow low-frequency bands that contain no FFT bin
  // receive no data and the visible peak for a tone like 50 Hz jumps to a
  // neighboring band while windowing sidelobes appear as separate peaks
  // far to the right on the logarithmic axis.
  var binHz = sampleRate / fftSize;
  var count = CFG.band_count;
  var out = new Float32Array(count);
  var maxBin = fftData.length - 1;
  for (var b = 0; b < count; b++) {
    // Step 1: interpolate at band center frequency.
    var centerBin = BAND_CENTERS[b] / binHz;
    if (centerBin < 0) { centerBin = 0; }
    if (centerBin > maxBin) { centerBin = maxBin; }
    var k0 = Math.floor(centerBin);
    var k1 = k0 + 1;
    if (k1 > maxBin) { k1 = maxBin; }
    var frac = centerBin - k0;
    var v0 = fftData[k0];
    var v1 = fftData[k1];
    if (!isFinite(v0)) { v0 = CFG.db_min; }
    if (!isFinite(v1)) { v1 = CFG.db_min; }
    var mx = v0 * (1 - frac) + v1 * frac;

    // Step 2: also scan any bins whose frequency falls inside the band.
    var lo = Math.max(0, Math.ceil(BAND_EDGES[b] / binHz));
    var hi = Math.min(fftData.length, Math.ceil(BAND_EDGES[b + 1] / binHz));
    for (var k = lo; k < hi; k++) {
      var v = fftData[k];
      if (isFinite(v) && v > mx) { mx = v; }
    }
    out[b] = isFinite(mx) ? mx : CFG.db_min;
  }
  return out;
}

function applyVolumeMode(rawLevels) {
  var n = rawLevels.length;
  var mode = CFG.volume_mode || 'relative';
  var gain = CFG.gain_db || 0;
  var dbMin = CFG.db_min, dbMax = CFG.db_max;
  var out = new Float32Array(n);
  if (mode === 'relative') {
    var peak = -Infinity;
    for (var i = 0; i < n; i++) { if (rawLevels[i] > peak) { peak = rawLevels[i]; } }
    var offset = isFinite(peak) ? peak : 0;
    for (var j = 0; j < n; j++) {
      out[j] = Math.min(dbMax, Math.max(dbMin, rawLevels[j] - offset + gain));
    }
  } else {
    for (var k = 0; k < n; k++) {
      out[k] = Math.min(dbMax, Math.max(dbMin, rawLevels[k] + gain));
    }
  }
  return out;
}

// ── Peak tracking ─────────────────────────────────────────────────────────────
function updatePeaks(levels) {
  ensurePeakArrays();
  var hold = CFG.peak_hold_frames || 0;
  for (var i = 0; i < levels.length; i++) {
    var v = Math.min(levels[i], CFG.db_max);
    if (v >= peakLevels[i]) {
      peakLevels[i] = v;
      peakHoldCounts[i] = hold;
    } else if (peakHoldCounts[i] > 0) {
      peakHoldCounts[i]--;
    } else {
      peakLevels[i] = Math.max(CFG.db_min, peakLevels[i] - PEAK_DECAY_DB);
    }
  }
}

function resetPeaks() {
  if (peakLevels) {
    peakLevels.fill(CFG.db_min);
    if (peakHoldCounts) { peakHoldCounts.fill(0); }
  }
}

// ── History ring buffer ───────────────────────────────────────────────────────
function addHistory(levels) {
  var maxR = CFG.history_rows || 0;
  if (maxR <= 0) { return; }
  var fps = Math.max(1, Number(CFG.history_fps) || DEFAULT_HISTORY_FPS);
  var now = performance.now();
  var intervalMs = 1000 / fps;
  if (now - historyLastPushMs < intervalMs) { return; }
  historyLastPushMs = now;
  historyRows.push(Float32Array.from(levels));
  while (historyRows.length > maxR) { historyRows.shift(); }
}

// ── Canvas geometry ───────────────────────────────────────────────────────────
var canvas = document.getElementById('eq-canvas');
var ctx = canvas.getContext('2d');
var dpr = 1;
var L = {};              // layout: pixel positions and sizes
var rowThresholds = [];  // [graph_height] floats, db_max down to db_min
var dbLabelRows = {};    // rowIndex → label string
var bandSpans = [];      // [{x,w}] one per band
var freqMarkers = [];    // [{freq,x,label}] for horizontal axis

function initLayout() {
  dpr = window.devicePixelRatio || 1;
  var cont = document.getElementById('canvas-container');
  var W = cont.clientWidth, H = cont.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var TITLE_H  = CFG.show_title       ? 28 : 0;
  var LABEL_W  = CFG.show_axis_labels ? 66 : 6;
  var NOTCH_W  = CFG.show_axis_labels ?  2 : 0;
  var FREQ_AXH = 2;
  var FREQ_LH  = CFG.show_axis_labels ? 20 : 0;
  var HIST_RH  = 16;
  var histN    = Math.max(0, CFG.history_rows || 0);
  var SHORTC_H = 0;

  var barX = LABEL_W + NOTCH_W;
  var barY = TITLE_H;
  var barW = W - LABEL_W - NOTCH_W;
  var barH = H - TITLE_H - FREQ_AXH - FREQ_LH - histN * HIST_RH - SHORTC_H;

  L = {
    W: W, H: H,
    titleH: TITLE_H, labelW: LABEL_W, notchW: NOTCH_W,
    freqAxH: FREQ_AXH, freqLblH: FREQ_LH,
    histRowH: HIST_RH, histN: histN,
    shortcutsH: SHORTC_H,
    barX: barX, barY: barY, barW: barW, barH: barH,
    rowH: barH / Math.max(1, CFG.graph_height || 10),
    freqAxY : barY + barH,
    freqLblY: barY + barH + FREQ_AXH,
    histY   : barY + barH + FREQ_AXH + FREQ_LH,
    shortY  : H - SHORTC_H
  };

  buildRowThresholds();
  buildDbLabelRows();
  buildBandSpans();
  buildFreqMarkers();
}

function buildRowThresholds() {
  var h = CFG.graph_height || 10;
  rowThresholds = [];
  if (h <= 1) { rowThresholds = [CFG.db_max]; return; }
  var step = (CFG.db_max - CFG.db_min) / (h - 1);
  for (var i = 0; i < h; i++) {
    rowThresholds.push(Math.round((CFG.db_max - i * step) * 1e10) / 1e10);
  }
}

function buildDbLabelRows() {
  dbLabelRows = {};
  var dbMin = CFG.db_min, dbMax = CFG.db_max;
  var dbInterval = CFG.db_interval, style = CFG.db_marker_style;

  if (style === 'all') {
    rowThresholds.forEach(function (t, i) { dbLabelRows[i] = String(Math.round(t)); });
    return;
  }

  // Collect interval-boundary dB values
  var top = Math.floor(dbMax / dbInterval) * dbInterval;
  var vals = [];
  var c = top;
  while (c >= dbMin - 1e-9) {
    vals.push(c);
    c = Math.round((c - dbInterval) * 1e10) / 1e10;
  }
  if (!vals.length || Math.abs(vals[0] - dbMax) > 1e-9) { vals.unshift(dbMax); }

  // Map each boundary to the nearest row threshold
  var rowMap = {};
  vals.forEach(function (v) {
    var best = 0, bestDist = Infinity;
    for (var i = 0; i < rowThresholds.length; i++) {
      var d = Math.abs(rowThresholds[i] - v);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    if (!(best in rowMap) ||
        bestDist < Math.abs(rowThresholds[best] - Number(rowMap[best]))) {
      rowMap[best] = String(Math.round(v));
    }
  });

  if (style === 'minimal') {
    var rows = Object.keys(rowMap).map(Number).sort(function (a, b) { return a - b; });
    if (rows.length > 2) {
      var keep = [rows[0], rows[rows.length - 1], rows[Math.floor(rows.length / 2)]];
      var f = {};
      keep.forEach(function (r) { if (r in rowMap) { f[r] = rowMap[r]; } });
      dbLabelRows = f;
      return;
    }
  }
  dbLabelRows = rowMap;
}

function buildBandSpans() {
  // Use a fixed span width across all bars to keep visual bar widths consistent.
  bandSpans = [];
  var W = L.barW, count = CFG.band_count;
  if (count <= 0) { return; }
  var step = W / count;
  for (var i = 0; i < count; i++) {
    bandSpans.push({ x: L.barX + i * step, w: Math.max(1, step) });
  }
}

function frequencyToBandPosition(freq) {
  var count = BAND_CENTERS.length;
  if (count <= 0) { return null; }
  if (freq <= BAND_CENTERS[0]) { return 0; }
  if (freq >= BAND_CENTERS[count - 1]) { return count - 1; }

  for (var i = 0; i < count - 1; i++) {
    var lo = BAND_CENTERS[i];
    var hi = BAND_CENTERS[i + 1];
    if (freq < lo || freq > hi) { continue; }
    var denom = Math.log(hi) - Math.log(lo);
    if (denom <= 0) { return i; }
    var t = (Math.log(freq) - Math.log(lo)) / denom;
    return i + Math.max(0, Math.min(1, t));
  }
  return count - 1;
}

function buildFreqMarkers() {
  freqMarkers = [];
  if (!CFG.show_axis_labels) { return; }
  var defaults = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
  var marks = (CFG.axis_frequencies && CFG.axis_frequencies.length)
    ? CFG.axis_frequencies : defaults;
  if (BAND_CENTERS.length <= 0) { return; }
  var minF = BAND_EDGES[0], maxF = BAND_EDGES[BAND_EDGES.length - 1];
  var count = BAND_CENTERS.length;
  marks.forEach(function (freq, idx) {
    if (freq < minF * 0.9 || freq > maxF * 1.1) { return; }
    var pos = frequencyToBandPosition(freq);
    if (pos === null) { return; }
    // Map band-units to pixels: +0.5 centers within the selected band, then
    // multiply by (L.barW / count) via this normalized width scaling.
    var x = L.barX + Math.round(((pos + 0.5) / count) * L.barW);
    var isLast = (idx === marks.length - 1);
    var label;
    if (freq >= 1000) {
      label = isLast
        ? (Math.round(freq / 1000) + 'kHz')
        : (Math.round(freq / 1000) + 'k');
    } else {
      label = isLast ? (Math.round(freq) + 'Hz') : String(Math.round(freq));
    }
    freqMarkers.push({ freq: freq, x: x, label: label });
  });
}

function dbToY(db) {
  var norm = (CFG.db_max - db) / (CFG.db_max - CFG.db_min);
  return L.barY + norm * L.barH;
}

function drawPeakDbLabels(peaks) {
  if (!CFG.peak_db_labels || !peaks) { return; }

  ctx.font = '10px Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = CFG.label_color;

  for (var i = 0; i < peaks.length; i++) {
    var peakDb = peaks[i];
    if (peakDb <= CFG.db_min) { continue; }

    var left = i > 0 ? peaks[i - 1] : CFG.db_min;
    var right = i + 1 < peaks.length ? peaks[i + 1] : CFG.db_min;
    if (peakDb < left || peakDb < right) { continue; }

    var label = String(Math.abs(Math.round(peakDb)));
    var span = bandSpans[i];
    var labelWidth = ctx.measureText(label).width;
    if (labelWidth > span.w) { continue; }

    var labelX = span.x + (span.w - labelWidth) / 2;
    var peakY = Math.round(dbToY(peakDb));
    var labelY = peakY - 2;
    if (labelY <= L.barY + 8) { continue; }

    ctx.fillText(label, labelX, labelY);
  }
}

// ── Hover tooltip ─────────────────────────────────────────────────────────────
function drawHoverTooltip() {
  if (!CFG.show_hover_tooltip || !hoverPos) { return; }
  var px = hoverPos.x, py = hoverPos.y;
  var barX = L.barX, barY = L.barY, barW = L.barW, barH = L.barH;
  if (barW <= 0 || barH <= 0) { return; }
  if (px < barX || px > barX + barW || py < barY || py > barY + barH) { return; }

  // Map cursor X to a frequency using the same log scale as the band layout.
  var minHz = BAND_EDGES[0];
  var maxHz = BAND_EDGES[BAND_EDGES.length - 1];
  var tx = (px - barX) / barW;
  if (tx < 0) { tx = 0; } else if (tx > 1) { tx = 1; }
  var freq = minHz * Math.pow(maxHz / minHz, tx);

  // Map cursor Y to a dB value using the current dB range.
  var ty = (py - barY) / barH;
  if (ty < 0) { ty = 0; } else if (ty > 1) { ty = 1; }
  var db = CFG.db_max - ty * (CFG.db_max - CFG.db_min);

  var freqLabel;
  if (freq >= 1000) {
    freqLabel = (freq / 1000).toFixed(freq >= 10000 ? 1 : 2) + ' kHz';
  } else {
    freqLabel = freq.toFixed(freq >= 100 ? 0 : 1) + ' Hz';
  }
  var dbLabel = (db >= 0 ? '+' : '') + db.toFixed(1) + ' dB';

  // Crosshair lines at the cursor, clipped to the chart area.
  ctx.fillStyle = CFG.axis_color;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(barX, Math.round(py), barW, 1);
  ctx.fillRect(Math.round(px), barY, 1, barH);
  ctx.globalAlpha = 1.0;

  // Tooltip box.
  ctx.font = '11px Consolas,monospace';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  var padX = 6, padY = 4, lineH = 13;
  var w1 = ctx.measureText(freqLabel).width;
  var w2 = ctx.measureText(dbLabel).width;
  var boxW = Math.ceil(Math.max(w1, w2)) + padX * 2;
  var boxH = lineH * 2 + padY * 2;

  // Place the box near the cursor, flipping sides when it would clip the chart.
  var boxX = px + 12;
  var boxY = py + 12;
  if (boxX + boxW > barX + barW) { boxX = px - 12 - boxW; }
  if (boxY + boxH > barY + barH) { boxY = py - 12 - boxH; }
  if (boxX < barX) { boxX = barX; }
  if (boxY < barY) { boxY = barY; }

  ctx.fillStyle = 'rgba(13, 17, 23, 0.88)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = CFG.axis_color;
  ctx.lineWidth = 1;
  ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);

  ctx.fillStyle = CFG.label_color;
  ctx.fillText(freqLabel, boxX + padX, boxY + padY);
  ctx.fillText(dbLabel, boxX + padX, boxY + padY + lineH);
}

// ── Canvas rendering ──────────────────────────────────────────────────────────
function drawFrame(levels, peaks, isFrozen) {
  var W = L.W, H = L.H;
  var barX = L.barX, barY = L.barY, barW = L.barW, barH = L.barH;
  var titleH = L.titleH, labelW = L.labelW;
  var freqAxY = L.freqAxY, freqLblY = L.freqLblY;
  var histY = L.histY, shortY = L.shortY;
  var histN = L.histN, histRowH = L.histRowH;

  if (barW <= 0 || barH <= 0) { return; }

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Title
  if (CFG.show_title && titleH > 0) {
    ctx.font = 'bold 13px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CFG.label_color;
    var titleStr = 'frequency-analyzer \u2014 ' + runtimeStatusMessage;
    if (isFrozen) { titleStr += ' \u25ae FROZEN'; }
    ctx.fillText(titleStr, W / 2, titleH / 2);
  }

  // dB axis labels
  if (CFG.show_axis_labels && labelW > 6) {
    ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CFG.label_color;
    Object.keys(dbLabelRows).forEach(function (ri) {
      var y = dbToY(Number(dbLabelRows[ri]));
      ctx.fillText(dbLabelRows[ri] + ' dB', labelW - 2, y);
    });
  }

  // Vertical axis line
  ctx.fillStyle = CFG.axis_color;
  ctx.fillRect(barX - 1, barY, 1, barH + L.freqAxH);

  // Spectrum trace
  if ((CFG.graph_style || 'filled') === 'line') {
    if (levels.length > 0) {
      ctx.strokeStyle = CFG.bar_color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (var i = 0; i < levels.length; i++) {
        var sp = bandSpans[i];
        var db = Math.max(CFG.db_min, levels[i]);
        var x = sp.x + sp.w / 2;
        var y = dbToY(db);
        if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = CFG.bar_color;
    for (var i = 0; i < levels.length; i++) {
      var db = levels[i];
      if (db <= CFG.db_min) { continue; }
      var sp = bandSpans[i];
      var top = dbToY(db);
      var ht = barY + barH - top;
      if (ht > 0) { ctx.fillRect(sp.x, top, sp.w, ht); }
    }
  }

  // Peak markers (1px horizontal stroke per band)
  if (peaks) {
    ctx.fillStyle = CFG.peak_color;
    for (var j = 0; j < peaks.length; j++) {
      var pdb = peaks[j];
      if (pdb <= CFG.db_min) { continue; }
      var psp = bandSpans[j];
      var py = Math.round(dbToY(pdb));
      ctx.fillRect(psp.x, py, psp.w, 1);
    }
  }
  drawPeakDbLabels(peaks);

  // Horizontal frequency axis line
  ctx.fillStyle = CFG.axis_color;
  ctx.fillRect(barX - 1, freqAxY, barW + 1, 1);

  if (CFG.show_axis_labels) {
    // Tick notches
    freqMarkers.forEach(function (m) {
      ctx.fillStyle = CFG.axis_color;
      ctx.fillRect(m.x, freqAxY - 3, 1, 5);
    });

    // Single-row frequency labels with overlap suppression
    ctx.font = '10px Consolas,monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = CFG.label_color;
    var placed = [];
    freqMarkers.forEach(function (m) {
      var lw = ctx.measureText(m.label).width;
      var lx = Math.max(barX, Math.min(barX + barW - lw, m.x - lw / 2));
      var overlaps = placed.some(function (p) {
        return lx < p[0] + p[1] + 4 && lx + lw + 4 > p[0];
      });
      if (!overlaps) {
        ctx.fillText(m.label, lx, freqLblY);
        placed.push([lx, lw]);
      }
    });
  }

  // History rows (opacity-scaled rectangles)
  if (histN > 0 && historyRows.length > 0) {
    var dbRange = CFG.db_max - CFG.db_min;
    var visible = historyRows.slice(-histN);
    for (var row = 0; row < visible.length; row++) {
      var rowData = visible[row];
      var ry = histY + row * histRowH;
      for (var bi = 0; bi < rowData.length; bi++) {
        var norm = Math.max(0, Math.min(1, (rowData[bi] - CFG.db_min) / dbRange));
        if (norm < 0.02) { continue; }
        var hsp = bandSpans[bi];
        ctx.globalAlpha = norm;
        ctx.fillStyle = CFG.history_color;
        ctx.fillRect(hsp.x, ry + 1, hsp.w, histRowH - 2);
      }
    }
    ctx.globalAlpha = 1.0;
  }

  drawHoverTooltip();
}

// ── Audio setup ───────────────────────────────────────────────────────────────
async function enumerateDevices() {
  var sel = document.getElementById('device-select');
  try {
    var devs = await navigator.mediaDevices.enumerateDevices();
    var inputs = devs.filter(function (d) { return d.kind === 'audioinput'; });
    sel.innerHTML = '<option value="">\u2014 select device \u2014</option>';
    inputs.forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || ('Microphone (' + d.deviceId.slice(0, 8) + '\u2026)');
      sel.appendChild(o);
    });
    if (!inputs.length) {
      setRuntimeStatusMessage('No audio input devices found');
    }
  } catch (e) {
    setRuntimeStatusMessage('Cannot list devices: ' + e.message);
  }
}

async function requestPermissionAndEnumerate() {
  try {
    var tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
    tmp.getTracks().forEach(function (t) { t.stop(); });
    await enumerateDevices();
    document.getElementById('start-prompt').style.display = 'none';
    setRuntimeStatusMessage('Ready \u2014 select a device and click \u25b6 Start');
  } catch (e) {
    setRuntimeStatusMessage('Microphone access denied: ' + e.message);
  }
}

function getFftSize() {
  return parseInt(String(CFG.fft_size), 10) || 4096;
}

async function startAudio(deviceId) {
  stopAudio();
  try {
    var constraints = {
      audio: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        sampleRate: { ideal: 48000 }
      }
    };
    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000
    });
    var source = audioCtx.createMediaStreamSource(mediaStream);
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = getFftSize();
    analyserNode.smoothingTimeConstant = 0;
    analyserNode.minDecibels = -120;
    analyserNode.maxDecibels = 0;
    connectChain(source, analyserNode);

    ensurePeakArrays();
    resetPeaks();
    historyRows = [];
    historyLastPushMs = 0;
    frozenLevels = null;

    setRuntimeStatusMessage('Analyzing\u2026');
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = '';
  } catch (e) {
    setRuntimeStatusMessage('Audio error: ' + e.message);
  }
}

function connectChain(source, analyser) {
  var mode = CFG.channel_mode || 'sum';
  if (mode === 'left' || mode === 'right') {
    // Extract a single channel via ChannelSplitterNode
    var splitter = audioCtx.createChannelSplitter(2);
    source.connect(splitter);
    splitter.connect(analyser, mode === 'left' ? 0 : 1, 0);
  } else {
    // sum / mid / mono: browser downmixes stereo automatically.
    // side (L-R) is not supported without AudioWorklet; falls back to sum.
    source.connect(analyser);
  }
}

function stopAudio() {
  if (analyserNode) { analyserNode.disconnect(); analyserNode = null; }
  if (audioCtx)     { audioCtx.close();          audioCtx = null;     }
  if (mediaStream)  {
    mediaStream.getTracks().forEach(function (t) { t.stop(); });
    mediaStream = null;
  }
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-stop').style.display  = 'none';
  setRuntimeStatusMessage('Stopped');
}

// ── Render loop ───────────────────────────────────────────────────────────────
var rafId = null;

function startLoop() {
  if (rafId !== null) { return; }
  function tick() {
    rafId = requestAnimationFrame(tick);
    renderTick();
  }
  rafId = requestAnimationFrame(tick);
}

function renderTick() {
  var levels;
  if (analyserNode) {
    if (frozen && frozenLevels) {
      levels = frozenLevels;
    } else {
      var binCount = analyserNode.frequencyBinCount;
      var fftData = (_fftBuf.length >= binCount) ? _fftBuf : new Float32Array(binCount);
      analyserNode.getFloatFrequencyData(fftData);
      var raw = computeBandLevels(fftData, audioCtx.sampleRate, analyserNode.fftSize);
      levels = applyVolumeMode(raw);
      if (!frozen) {
        updatePeaks(levels);
        addHistory(levels);
        frozenLevels = levels;
      }
    }
  } else {
    levels = new Float32Array(CFG.band_count).fill(CFG.db_min);
  }
  drawFrame(levels, peakLevels, frozen);
}

// ── UI wiring ─────────────────────────────────────────────────────────────────
/**
 * Update the runtime status text used by the chart title row.
 * @param {string} msg Status text for the current analyzer state.
 * The new value is rendered on the next animation frame.
 */
function setRuntimeStatusMessage(msg) {
  runtimeStatusMessage = msg;
}

function setFreezeButtonLabel(btn, isFrozen) {
  var pauseIcon = '\u23f8 ';
  btn.replaceChildren();
  var labelText = isFrozen ? 'Frozen' : 'Freeze';
  if (isFrozen) {
    btn.append(document.createTextNode(pauseIcon));
  }
  var underlinedLetter = document.createElement('u');
  underlinedLetter.textContent = labelText.charAt(0);
  btn.append(underlinedLetter);
  btn.append(document.createTextNode(labelText.slice(1)));
}

function wireUi() {
  document.getElementById('btn-detect').addEventListener('click', function () {
    requestPermissionAndEnumerate();
  });

  document.getElementById('btn-start').addEventListener('click', async function () {
    var deviceId = document.getElementById('device-select').value;
    if (!deviceId) {
      setRuntimeStatusMessage('Select a device first');
      return;
    }
    await startAudio(deviceId);
  });

  document.getElementById('btn-stop').addEventListener('click', stopAudio);

  document.getElementById('sel-profile').addEventListener('change', applyProfilePreset);

  document.getElementById('btn-freeze').addEventListener('click', function () {
    frozen = !frozen;
    var btn = document.getElementById('btn-freeze');
    btn.classList.toggle('active', frozen);
    setFreezeButtonLabel(btn, frozen);
  });

  document.getElementById('btn-reset').addEventListener('click', resetPeaks);

  document.getElementById('btn-snap').addEventListener('click', function () {
    var a = document.createElement('a');
    a.download = 'eq-cli-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') { return; }
    if (document.getElementById('settings-overlay').style.display === 'block') { return; }
    switch (e.key.toLowerCase()) {
      case 'f':
        document.getElementById('btn-freeze').click();
        e.preventDefault();
        break;
      case 'r':
        resetPeaks();
        e.preventDefault();
        break;
      case 's':
        document.getElementById('btn-snap').click();
        e.preventDefault();
        break;
    }
  });

  // Reinitialise canvas pixel layout whenever the container changes size
  var _ro = new ResizeObserver(function () { initLayout(); });
  _ro.observe(document.getElementById('canvas-container'));

  // Hover tooltip mouse tracking.  We convert clientX/clientY to CSS pixels
  // relative to the canvas so positions line up with the layout `L.bar*`
  // coordinates produced by `initLayout`.
  canvas.addEventListener('mousemove', function (e) {
    var rect = canvas.getBoundingClientRect();
    hoverPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  });
  canvas.addEventListener('mouseleave', function () {
    hoverPos = null;
  });

  // ── Settings panel event wiring ─────────────────────────────────────────────
  document.getElementById('btn-settings').addEventListener('click', openSettings);
  document.getElementById('btn-settings-close').addEventListener('click', closeSettings);
  document.getElementById('btn-settings-cancel').addEventListener('click', closeSettings);
  document.getElementById('btn-settings-save').addEventListener('click', applySettings);
  document.getElementById('btn-settings-reset').addEventListener('click', resetSettingsToDefaults);
  // Click on the backdrop (not the panel) also closes
  document.getElementById('settings-overlay').addEventListener('click', function (e) {
    if (e.target === this) { closeSettings(); }
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadConfig();
  document.getElementById('version-badge').textContent = 'v' + (CFG.app_version || DEFAULT_VERSION);
  rebuildBandGeometry();
  ensurePeakArrays();

  document.title = 'frequency-analyzer';
  populateProfilePresets();

  initLayout();
  startLoop();

  // If microphone permission was already granted, device labels will be
  // populated; skip the detect prompt in that case.
  try {
    var devs = await navigator.mediaDevices.enumerateDevices();
    if (devs.some(function (d) { return d.kind === 'audioinput' && d.label; })) {
      document.getElementById('start-prompt').style.display = 'none';
      await enumerateDevices();
      setRuntimeStatusMessage('Ready \u2014 select a device and click \u25b6 Start');
    }
  } catch (e) { console.warn('Device enumeration failed, will prompt on detect click:', e); }
}

window.addEventListener('DOMContentLoaded', function () {
  wireUi();
  init();
});
</script>
